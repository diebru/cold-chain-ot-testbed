# Broker MQTT, versione VULNERABILE.
# Da Mosquitto 2.0 il default è sicuro: senza configurazione accetta solo
# connessioni locali. Qui il default viene disattivato a mano, come fanno molti
# integratori per "far funzionare tutto": listener su tutte le interfacce,
# accesso anonimo, nessuna ACL, nessun TLS.
listener 1883 0.0.0.0
allow_anonymous true

persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
