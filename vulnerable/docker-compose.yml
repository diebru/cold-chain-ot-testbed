# Banco di prova VULNERABILE.
#
# Due reti, come in un supermercato:
# - "campo": il bus di campo tra il supervisore e i regolatori di banco
#   (negli impianti reali è di solito un bus seriale RS-485),
# - "negozio": la rete IP del punto vendita, piatta. Ci stanno il supervisore,
#   il monitoraggio indipendente (sonda, broker, centrale), il servizio di
#   telegestione e l'attaccante.
#
# Isolamento:
# - entrambe le reti sono interne: nessun container collegato solo a loro
#   (in particolare l'attaccante) può raggiungere Internet o la rete di casa,
# - le interfacce web sono pubblicate solo su 127.0.0.1 del PC (o del Raspberry).
#
# Le immagini partono da python:3.12-slim e eclipse-mosquitto, disponibili sia per
# x86_64 sia per arm64: lo stesso file gira sul PC e sul Raspberry Pi.

name: coldchain-vulnerable

x-python-env: &python-env
  TZ: Europe/Rome
  SIM_SPEED: ${SIM_SPEED:-60}

services:
  # Impianto frigorifero (fornitore)

  regolatore1:
    build: ./regolatore
    environment:
      <<: *python-env
      CASE_ID: banco1
      SETPOINT_C: "-20"
      DEFROST_DURATION_MIN: "20"
      DEFROST_END_C: "5"
      DEFROST_INTERVAL_MIN: "360"
    volumes:
      - fisica:/plant
    networks:
      campo:
        ipv4_address: 10.77.20.11
    restart: unless-stopped

  regolatore2:
    build: ./regolatore
    environment:
      <<: *python-env
      CASE_ID: banco2
      SETPOINT_C: "3"
      DEFROST_DURATION_MIN: "15"
      DEFROST_END_C: "10"
      DEFROST_INTERVAL_MIN: "240"
    volumes:
      - fisica:/plant
    networks:
      campo:
        ipv4_address: 10.77.20.12
    restart: unless-stopped

  supervisore:
    build: ./supervisore
    environment:
      <<: *python-env
      RC1_HOST: 10.77.20.11
      RC2_HOST: 10.77.20.12
      NOTIFY_URL: http://10.77.10.50:8080/notifica
    networks:
      campo:
        ipv4_address: 10.77.20.10
      negozio:
        ipv4_address: 10.77.10.10
      accesso_locale: {}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8080:80"
    depends_on: [regolatore1, regolatore2, telegestione]
    restart: unless-stopped

  telegestione:
    build: ./telegestione
    environment:
      TZ: Europe/Rome
    networks:
      negozio:
        ipv4_address: 10.77.10.50
      accesso_locale: {}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8082:8080"
    restart: unless-stopped

  # Monitoraggio indipendente (sistema separato, come all'EFS)

  broker:
    image: eclipse-mosquitto:2.0.20
    volumes:
      - ./broker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    networks:
      negozio:
        ipv4_address: 10.77.10.20
    restart: unless-stopped

  sonda:
    build: ./sonda
    environment:
      TZ: Europe/Rome
      SENSOR_SOURCE: ${SENSOR_SOURCE:-plant}
      BROKER_HOST: 10.77.10.20
    volumes:
      - fisica:/plant:ro
    networks:
      negozio:
        ipv4_address: 10.77.10.30
    depends_on: [regolatore1, broker]
    restart: unless-stopped

  centrale:
    build: ./centrale
    environment:
      TZ: Europe/Rome
      BROKER_HOST: 10.77.10.20
      ALARM_HIGH_C: "-10"
      ALARM_DELAY_READINGS: "3"
      CRITICAL_C: "-5"
    networks:
      negozio:
        ipv4_address: 10.77.10.40
      accesso_locale: {}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8081:8080"
    depends_on: [broker]
    restart: unless-stopped

  # Attaccante

  attaccante:
    build: ./attaccante
    environment:
      TZ: Europe/Rome
    volumes:
      - ./attaccante/attacks:/attacks
    networks:
      negozio:
        ipv4_address: 10.77.10.66
    init: true
    restart: unless-stopped

volumes:
  # La "fisica": ogni regolatore scrive la temperatura vera del suo banco,
  # la sonda indipendente la legge. Non passa dalla rete.
  fisica:

networks:
  negozio:
    internal: true
    ipam:
      config:
        - subnet: 10.77.10.0/24
  campo:
    internal: true
    ipam:
      config:
        - subnet: 10.77.20.0/24
  accesso_locale: {}
